<!doctype html><html lang="ja"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:2500px;height:1686px;font-family:"Noto Sans CJK JP","Hiragino Sans",sans-serif;
       display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
       background:#F3E9DA}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;
        border:6px solid #F3E9DA;border-radius:40px;position:relative}
  .c1{background:linear-gradient(145deg,#C08A4E,#A86F39);grid-column:span 2}
  .c1 .label{font-size:128px}
  .c1 .sub{font-size:62px}
  .c1 svg{width:240px;height:240px}
  .c2{background:linear-gradient(145deg,#CFA06A,#B9854C)}
  .c3{background:linear-gradient(145deg,#C8A882,#AE8B61)}
  .c4{background:linear-gradient(145deg,#E3D2BA,#D2BC9C)}
  .c5{background:linear-gradient(145deg,#DCCAB2,#C9B193)}
  .c6{background:linear-gradient(145deg,#D5C0A6,#BFA685)}
  .label{font-size:104px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
  .sub{font-size:58px;font-weight:500;letter-spacing:.04em;margin-top:-22px}
  .light .label{color:#FFFFFF}.light .sub{color:#F6EADA}
  .dark .label{color:#6B4722}.dark .sub{color:#8A6239}
  svg{width:210px;height:210px}
</style></head><body>
  <div class="cell c1 light">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9a2 2 0 0 1 2-2h2.3l1.3-2h6.8l1.3 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
    <div class="label">申請する</div><div class="sub">領収書・交通費・研修費</div>
  </div>
  <div class="cell c3 light">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    <div class="label">申請履歴</div><div class="sub">これまでの申請</div>
  </div>
  <div class="cell c4 dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6B4722" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.3"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.11a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1z"/></svg>
    <div class="label">設定</div><div class="sub">氏名・最寄り駅・定期券</div>
  </div>
  <div class="cell c5 dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6B4722" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
    <div class="label">使い方</div><div class="sub">はじめての方へ</div>
  </div>
  <div class="cell c6 dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6B4722" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.7-5a8.2 8.2 0 0 1-.7-3.4A8.4 8.4 0 0 1 12.5 4 8.4 8.4 0 0 1 21 11.5z"/><path d="M9.6 10.2a2.4 2.4 0 1 1 3.4 2.2c-.6.3-1 .9-1 1.6"/><circle cx="12" cy="16.4" r=".9" fill="#6B4722" stroke="none"/></svg>
    <div class="label">問い合わせ</div><div class="sub">担当に連絡する</div>
  </div>
</body></html>
